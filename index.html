<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary Trainer</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f3f8;
    color: #25283b;
}

header {
    background: #34365e;
    color: white;
    padding: 25px;
    text-align: center;
}

header h1 {
    margin: 0;
}

header p {
    color: #d6d7ee;
}

.container {
    max-width: 650px;
    margin: 25px auto;
    padding: 15px;
}

select, button, input {
    font: inherit;
}

select {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 9px;
    margin-bottom: 15px;
    background: white;
}

.progress {
    background: #ddd;
    height: 9px;
    border-radius: 20px;
    margin: 15px 0;
    overflow: hidden;
}

.progress div {
    height: 100%;
    background: #7776d9;
    width: 0%;
    transition: .3s;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 35px 20px;
    text-align: center;
    min-height: 260px;
    box-shadow: 0 5px 20px #0000000c;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.card small {
    color: #85859b;
    margin-bottom: 20px;
}

.card h2 {
    font-size: 32px;
    margin: 10px 0;
    overflow-wrap: anywhere;
}

.card p {
    color: #66677c;
    line-height: 1.6;
}

button {
    border: none;
    border-radius: 9px;
    padding: 12px 17px;
    cursor: pointer;
    margin: 5px;
    background: #e9e9f5;
    color: #34365e;
    font-weight: bold;
}

button:hover {
    opacity: .85;
}

.primary {
    background: #5555aa;
    color: white;
}

.green {
    background: #d9f3e1;
    color: #267342;
}

.red {
    background: #ffe1e1;
    color: #a33a3a;
}

.controls {
    text-align: center;
    margin-top: 20px;
}

.stats {
    display: flex;
    justify-content: space-around;
    text-align: center;
    margin: 20px 0;
}

.stats strong {
    display: block;
    font-size: 22px;
}

.tabs {
    display: flex;
    margin-bottom: 15px;
}

.tabs button {
    flex: 1;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #ddd;
    border-radius: 9px;
    margin-top: 15px;
}

#feedback {
    min-height: 30px;
    font-weight: bold;
    text-align: center;
    margin-top: 12px;
}

.hidden {
    display: none;
}

footer {
    text-align: center;
    color: #999;
    padding: 25px;
    font-size: 13px;
}
</style>
</head>

<body>

<header>
    <h1>WordWise</h1>
    <p>Your personal vocabulary and spelling trainer.</p>
</header>

<div class="container">

    <label>Select vocabulary list:</label>

    <select id="listSelect" onchange="changeList()">
        <option value="0">List 1 – City Beat Dreams (Pages 1–4)</option>
        <option value="1">List 2 – City Beat Dreams (Pages 5–8)</option>
        <option value="2">List 2 – The Brother Who Failed (Pages 9–12)</option>
        <option value="all">All vocabulary lists</option>
    </select>

    <div class="tabs">
        <button onclick="setMode('flash')">Flashcards</button>
        <button onclick="setMode('quiz')">Quiz Mode</button>
    </div>

    <div class="stats">
        <div>
            <strong id="number">1/1</strong>
            <small>Card</small>
        </div>
        <div>
            <strong id="learned">0</strong>
            <small>Mastered</small>
        </div>
        <div>
            <strong id="score">0</strong>
            <small>Quiz Score</small>
        </div>
    </div>

    <div class="progress">
        <div id="progressBar"></div>
    </div>

    <!-- FLASHCARD MODE -->

    <section id="flashMode">

        <div class="card">
            <small id="cardLabel">VOCABULARY WORD</small>
            <h2 id="word">Loading...</h2>
            <p id="definition" class="hidden"></p>
        </div>

        <div class="controls">
            <button class="primary" onclick="flipCard()" id="flipButton">
                Show Answer
            </button>
            <br>
            <button onclick="previousCard()">← Previous</button>
            <button onclick="nextCard()">Next →</button>
            <br>
            <button class="green" onclick="markLearned(true)">✓ Got it</button>
            <button class="red" onclick="markLearned(false)">↻ Still learning</button>
            <br>
            <button onclick="shuffleCards()">🔀 Shuffle</button>
        </div>

    </section>

    <!-- QUIZ MODE -->

    <section id="quizMode" class="hidden">

        <div class="card">
            <small>GUESS THE VOCABULARY WORD</small>
            <h2 id="question">Loading...</h2>
            <p>Type the word that matches this definition.</p>
        </div>

        <input id="answerInput" placeholder="Type your answer..."
        autocomplete="off">

        <div class="controls">
            <button class="primary" onclick="checkAnswer()">Check Answer</button>
            <button onclick="nextQuestion()">Next Question →</button>
        </div>

        <p id="feedback"></p>

    </section>

    <div class="controls">
        <button onclick="restart()">↻ Restart</button>
    </div>

</div>

<footer>
    WordWise Vocabulary Trainer · Level I · Term 1
</footer>

<script>

const vocabulary = [

{
list: 0,
words: [

["get on one's nerves", "To annoy or irritate someone."],
["get off my case", "Stop criticizing, bothering or pressuring me."],
["apartment", "A set of rooms used as a home within a larger building."],
["tense", "Nervous, worried or unable to relax."],
["college", "An educational institution for higher learning."],
["fire escape", "An emergency staircase or exit from a building."],
["acrobat", "A performer who does impressive physical tricks."],
["spin", "To turn around quickly."],
["beat", "To defeat someone or something; also a regular rhythm."],
["split", "To divide into parts or separate."],
["handstands", "Positions in which someone balances upside down on their hands."],
["pattern", "A repeated design, arrangement or sequence."],
["matter", "Something important; or the substance something is made of."],
["supposed", "Expected or believed to be true."],
["scholarship", "Financial assistance given to help someone study."],
["trouble", "A problem or difficulty."],
["bugs", "Small insects; also problems in a computer program."],
["excitement", "A feeling of great enthusiasm or happiness."],
["museum", "A place where historical, artistic or scientific objects are displayed."],
["daydreaming", "Thinking about pleasant things while not paying attention."],
["pole", "A long, narrow, upright object."],
["exhibit", "An object or collection displayed publicly."],
["popular", "Liked or admired by many people."],
["planetarium", "A place where people learn about stars and planets."],
["path", "A way or route that someone can follow."]

]
},

{
list: 1,
words: [

["audience", "A group of people watching or listening to a performance."],
["twirl", "To spin or turn around quickly."],
["chicken out", "To decide not to do something because of fear."],
["instruction", "Information explaining how to do something."],
["quit", "To stop doing something."],
["motioning", "Making a gesture to communicate or signal something."],
["representative", "Someone chosen to speak or act for a group."],
["flier", "A printed sheet of paper used to advertise something."],
["bounds", "Leaps or jumps; also limits."],
["mutter", "To speak quietly and unclearly."],
["slouch", "To sit or stand with a drooping posture."],
["trudge", "To walk slowly and heavily, usually because of tiredness."],
["conversation", "A talk between two or more people."],
["contest", "A competition in which people try to win."],
["commercials", "Advertisements, especially those shown on television."],
["stares", "Looks at someone or something for a long time."],
["somersault", "A movement in which someone rolls their body over completely."],
["barges", "Enters or moves somewhere rudely or forcefully."],
["improve", "To make or become better."],
["pivoting", "Turning around a fixed point."],
["cartwheel", "A sideways movement in which someone rotates their body using their hands."],
["creep", "To move slowly and quietly."],
]

},

{
list: 2,
words: [

["originate", "To begin or come from a particular source."],
["tedious", "Boring and tiring because it takes a long time."],
["engagement", "An agreement to get married; also involvement in an activity."],
["acres", "Units used to measure areas of land."],
["fertile", "Able to produce healthy plants or crops."],
["shrewd", "Clever at making decisions and understanding situations."],
["preceding", "Coming before something else in time or order."],
["pneumonia", "An illness that causes inflammation in the lungs."],
["homesick", "Feeling sad because you miss your home."],
["prosperous", "Successful, wealthy or doing well financially."],
["resolute", "Very determined and not easily discouraged."],
["influence", "The power to affect someone's actions or opinions."],
["complacently", "In a way that shows too much satisfaction with oneself."],
["slumber", "Sleep."],
["rustic", "Related to the countryside or rural life."],
["finance", "The management of money."],
["imperious", "Acting as though you have the right to give orders."],
["somber", "Serious, gloomy or sad."],
["envy", "A feeling of wanting something someone else has."],
["contradict", "To say the opposite of what someone else has said."],
["emphatically", "In a strong, definite and forceful way."],
["disgrace", "A loss of respect or honour; shame."]
]

}

];

let cards = [];
let index = 0;
let flipped = false;
let mode = "flash";
let mastered = new Set();
let quizScore = 0;
let quizAnswered = false;

function changeList() {

    const value = document.getElementById("listSelect").value;

    if (value === "all") {
        cards = vocabulary.flatMap(group => group.words);
    } else {
        cards = vocabulary[Number(value)].words.slice();
    }

    index = 0;
    flipped = false;
    quizScore = 0;
    quizAnswered = false;

    update();
}

function update() {

    if (!cards.length) return;

    index = Math.max(0, Math.min(index, cards.length - 1));

    document.getElementById("number").textContent =
        (index + 1) + "/" + cards.length;

    document.getElementById("learned").textContent =
        mastered.size;

    document.getElementById("score").textContent =
        quizScore;

    document.getElementById("progressBar").style.width =
        ((index + 1) / cards.length * 100) + "%";

    document.getElementById("word").textContent =
        cards[index][0];

    document.getElementById("definition").textContent =
        cards[index][1];

    document.getElementById("definition").classList.toggle(
        "hidden", !flipped
    );

    document.getElementById("word").classList.toggle(
        "hidden", flipped
    );

    document.getElementById("cardLabel").textContent =
        flipped ? "DEFINITION" : "VOCABULARY WORD";

    document.getElementById("flipButton").textContent =
        flipped ? "Show Word" : "Show Answer";

    document.getElementById("question").textContent =
        cards[index][1];

    document.getElementById("answerInput").value = "";

    document.getElementById("feedback").textContent = "";

    quizAnswered = false;
}

function flipCard() {
    flipped = !flipped;
    update();
}

function nextCard() {
    index = (index + 1) % cards.length;
    flipped = false;
    update();
}

function previousCard() {
    index = (index - 1 + cards.length) % cards.length;
    flipped = false;
    update();
}

function markLearned(value) {

    const key = cards[index][0];

    if (value) {
        mastered.add(key);
    } else {
        mastered.delete(key);
    }

    document.getElementById("learned").textContent =
        mastered.size;

    nextCard();
}

function shuffleCards() {

    for (let i = cards.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [cards[i], cards[j]] = [cards[j], cards[i]];
    }

    index = 0;
    flipped = false;
    update();
}

function setMode(selected) {

    mode = selected;

    document.getElementById("flashMode").classList.toggle(
        "hidden", mode !== "flash"
    );

    document.getElementById("quizMode").classList.toggle(
        "hidden", mode !== "quiz"
    );

    update();
}

function checkAnswer() {

    if (quizAnswered) return;

    const answer = document.getElementById("answerInput")
        .value.trim().toLowerCase();

    const correct = cards[index][0].toLowerCase();

    const feedback = document.getElementById("feedback");

    if (!answer) {
        feedback.textContent = "Type an answer first!";
        feedback.style.color = "#a33a3a";
        return;
    }

    quizAnswered = true;

    if (answer === correct) {

        quizScore++;

        feedback.textContent = "✓ Correct! Well done!";
        feedback.style.color = "#267342";

    } else {

        feedback.textContent =
            "Not quite! The correct answer is: " + cards[index][0];

        feedback.style.color = "#a33a3a";
    }

    document.getElementById("score").textContent = quizScore;
}

function nextQuestion() {
    index = (index + 1) % cards.length;
    update();
}

function restart() {

    index = 0;
    quizScore = 0;
    mastered.clear();
    flipped = false;

    changeList();
}

document.getElementById("answerInput").addEventListener(
    "keydown", function(event) {
        if (event.key === "Enter") checkAnswer();
    }
);

changeList();

</script>

</body>
</html>
